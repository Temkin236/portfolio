services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - GEMINI_MODEL=gemini-2.5-flash
      - DATABASE_URL=sqlite:///./temkins_world.db
    volumes:
      - ./backend/temkins_world.db:/app/temkins_world.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
